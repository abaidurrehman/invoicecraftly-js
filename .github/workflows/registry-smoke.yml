name: Registry smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install published package in clean project
        run: |
          mkdir /tmp/invoicecraftly-registry-smoke
          cd /tmp/invoicecraftly-registry-smoke
          npm init -y
          npm install @invoicecraftly/client@0.1.0
          node --input-type=module -e "import('@invoicecraftly/client').then(m => { if (m.INVOICECRAFTLY_SDK_VERSION !== '0.1.0') process.exit(1); console.log('installed', m.INVOICECRAFTLY_SDK_VERSION); })"
