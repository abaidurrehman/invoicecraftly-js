name: Lockfile evidence

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts
      - name: Print package lock evidence
        run: |
          echo '---PACKAGE_LOCK_BEGIN---'
          cat package-lock.json
          echo '---PACKAGE_LOCK_END---'
